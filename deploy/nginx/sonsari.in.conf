# Vocal For Local — Nginx (TLS, static files, reverse proxy to Node on :4000)
#
#   /assets/*, icons, manifest  → served from client/dist (immutable cache)
#   /uploads/*                  → product/store photos from /var/lib/vfl/uploads
#   /api/*                      → Node API
#   everything else             → Node (renders HTML with per-page SEO tags, then the SPA takes over)

upstream vfl_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# HTTP → HTTPS (keep ACME challenges on port 80 for certificate renewals)
server {
    listen 80;
    listen [::]:80;
    server_name sonsari.in www.sonsari.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sonsari.in$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sonsari.in;

    ssl_certificate     /etc/letsencrypt/live/sonsari.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonsari.in/privkey.pem;

    return 301 https://sonsari.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sonsari.in;

    ssl_certificate     /etc/letsencrypt/live/sonsari.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonsari.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Product photo uploads are up to 8 MB (resized server-side).
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    root /opt/vfl/app/client/dist;

    # Hashed build assets — cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded images (file names are random UUIDs, so they never change).
    location /uploads/ {
        alias /var/lib/vfl/uploads/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Service worker + manifest must always be revalidated so app updates roll out.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://vfl_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # The raw SPA shell has no page-specific SEO tags — never serve it as a separate URL.
    location = /index.html {
        return 301 /;
    }

    # Static files in client/dist (icons, og-image.png, robots via Node) else → Node for SEO-rendered HTML.
    location / {
        try_files $uri @node;
    }

    location @node {
        proxy_pass http://vfl_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
